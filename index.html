<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@100;200;300;400;500;600;700;800;900&family=Hahmlet:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./top.css">
    <link rel="stylesheet" href="./index.css">
    <link rel="import" href="./top.html">

    <title>[Discord] 잠겜동</title>
</head>

<body>
    <script>
        window.addEventListener('load', function() {
            var allElements = document.getElementsByTagName('*');
            Array.prototype.forEach.call(allElements, function(el) {
                var includePath = el.dataset.includePath;
                if (includePath) {
                    var xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function () {
                        if (this.readyState == 4 && this.status == 200) {
                            el.outerHTML = this.responseText;
                        }
                    };
                    xhttp.open('GET', includePath, true);
                    xhttp.send();
                }
            });
        });
    </script>

    <div id="top" style="margin-bottom: 85px;">
        <div data-include-path="./top.html"></div>
    </div>

    <div id="main-title">
        <div id="main-img">
            <img src="./img/main-img.jpg">
        </div>

        <div id="color-overlay"></div>

        <div id="text-overlay">
            <a>잠겜동</a><br>
            <span>Game & Friendship　Discord Channel.</span>
        </div>
    </div>
    
    <div id="main">
        <img src="./img/discord.svg" width="250px"><br>
        <span>해당 링크는 유효기간이 <b>영구</b> 인 디스코드 링크입니다.<br> 입장하시려면 아래 버튼을 눌러주세요.</span>
    </div>

    <div id="main-btn">
        <div id="main-join-btn" onclick="window.open('https://discord.gg/rMSYGxeQ5V');" style="cursor: pointer;">
            <a>서버 입장하기</a>
        </div>
    </div>
</body>
</html>
