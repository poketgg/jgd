    <link rel="import" href="./top.html">

    <title>[Discord] 잠겜동</title>
</head>

<style>
    li{
        padding-left: -50px !important;
    }
</style>

<body>
    <script>
        window.addEventListener('load', function() {
            var allElements = document.getElementsByTagName('*');
            Array.prototype.forEach.call(allElements, function(el) {
                var includePath = el.dataset.includePath;
                if (includePath) {
                    var xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function () {
                        if (this.readyState == 4 && this.status == 200) {
                            el.outerHTML = this.responseText;
                        }
                    };
                    xhttp.open('GET', includePath, true);
                    xhttp.send();
                }
            });
        });
    </script>

    <div id="top" style="margin-bottom: 85px;">
        <div data-include-path="./top.html"></div>
    </div>
    <div id="api">
        <div class="discord-widget">
        </div>
    </div>
    <script type="text/javascript" src="//cdn.jsdelivr.net/discord-widget/latest/discord-widget.min.js"></script>
    <script type="text/javascript">
        discordWidget.init({
        serverId: '959844710992732212',
        title: '잠겜동',
        join: false,
        alphabetical: false,
        theme: 'dark',
        hideChannels: ['Channel Name 1', '잠수방'],
        showAllUsers: true,
        allUsersDefaultState: true,
        showNick: true
        });
        discordWidget.render();
    </script>


</body>
</html>
